services:
  - type: web
    name: nexuserp
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node --max-old-space-size=450 server.js
    # v1.0001200: no-auth probe; reports data source, record counts, Turso state and the read-only flag.
    healthCheckPath: /api/health
    # Persistent disk (second safety next to Turso). Render disks need a paid instance type
    # (not the free plan) and turn off zero-downtime deploys (one instance at a time).
    disk:
      name: nexuserp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=450
      - key: DB_PATH
        value: /var/data/db.json
      - key: UPLOADS_PATH
        value: /var/data/uploads
      # v1.0001201 strict remote mode: Turso is the only database and Dropbox the only file store, no local
      # fallback (failure -> read-only / upload refused). Also on by default when Render's RENDER env is set;
      # listed here so it is explicit. 0 turns it off (never on Render).
      - key: STRICT_REMOTE
        value: "1"
      # Optional: seconds between the Dropbox reachability / local-only file checks (default 300).
      - key: DROPBOX_CHECK_SEC
        sync: false
      # Turso switch and credentials: values are set in the Render dashboard, never in git.
      # In strict mode TURSO_ENABLED is not needed (Turso is always on); URL/token fall back to the
      # INITIAL_CONFIG defaults in constants.tsx when these are unset.
      - key: TURSO_ENABLED
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Dropbox (uploaded files only; the database itself lives in Turso / on the disk).
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
